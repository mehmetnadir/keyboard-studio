name: CI

# Runs on every push and pull request so a contribution cannot land broken
# code. Publishing stays off CI on purpose: releases are built and signed on a
# maintainer's machine with a real Developer ID, because macOS ties permissions
# to the code identity. A CI build signed with a different identity (or ad-hoc)
# would arrive as a different app, revoking Input Monitoring and silently
# stopping typing statistics for everyone who updates.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # macos-14 ships Swift 5.10; this package needs the 6.0 toolchain.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          ls /Applications | grep -i '^Xcode' || true
          sudo xcode-select -s /Applications/Xcode_16.app 2>/dev/null \
            || echo "Xcode_16.app not present; using the default toolchain"
          swift --version

      - name: Build
        run: swift build -v

      - name: Test
        run: swift test

      # The privacy promise in PRIVACY.md is checkable, so check it. A pull
      # request that adds networking to the app fails here rather than being
      # noticed later — or not at all.
      - name: No networking in the app
        run: |
          if grep -rn 'URLSession\|NWConnection\|CFSocket\|Network\.framework' Sources/; then
            echo "::error::Sources contain networking. PRIVACY.md promises the app never reaches the network."
            exit 1
          fi
          echo "No networking found, as promised."

      - name: Build the app bundle
        # -x so a failure names the line that failed: the step was exiting with
        # only a status code and no message, which is not something to guess at.
        run: bash -x ./scripts/bundle.sh release
